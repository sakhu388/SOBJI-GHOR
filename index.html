.li{display:flex;align-items:center;gap:10px}.li .em{font-size:28px}.li div{flex:1}.li small{color:var(--mu);display:block}
.ln{display:flex;justify-content:space-between;padding:5px 0}.ln.t{font-weight:800;font-size:19px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
.btn.o{background:#fff;color:var(--g);border:2px solid var(--g)}

.chip{border:1px solid #ccd8ce;background:#fff;border-radius:20px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chip.cur{outline:3px solid #f6c744}
.note{font-size:12.5px;color:var(--mu);margin:8px 0}
.info{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:14px;margin:10px 0}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.pill{background:var(--lt);color:var(--g);border-radius:20px;padding:3px 10px;font-size:12px;white-space:nowrap}
details.card summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--g);color:#fff;border:0;border-radius:28px;padding:14px 20px;font:inherit;font-weight:700;box-shadow:0 4px 14px #0003;cursor:pointer;z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}

nav button span{display:block;font-size:22px}
nav button.on{color:var(--g);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:11px 18px;border-radius:10px;z-index:20;max-width:90%;display:none;font-size:14px;text-align:center}

document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,n=b.dataset.n;
 if(a==="tab"){S.view=b.dataset.v;render();scrollTo(0,0)}
 else if(a==="back"){readForm();var pv=S.view==="checkout"?"cart":(S.view==="login"?(S.prev||"home"):"home");S.after=null;go(pv)}
 else if(a==="add"){bump(S.cart,n,1);render()}
 else if(a==="sub"){bump(S.cart,n,-1);render()}
 else if(a==="checkout"){need(function(){go("checkout")})}
 else if(a==="wopen"){need(function(){go("weekly")})}
 else if(a==="wday"){var d=b.dataset.d,i=S.days.indexOf(d);readForm();if(i>-1)S.days.splice(i,1);else{S.days.push(d);S.plan[d]=S.plan[d]||{}}S.cur=DAYS.indexOf(d);render()}
 else if(a==="wcur"){readForm();S.cur=Number(b.dataset.i);render()}
 else if(a==="wadd"){readForm();S.plan[DAYS[S.cur]]=S.plan[DAYS[S.cur]]||{};bump(S.plan[DAYS[S.cur]],n,1);render()}
 else if(a==="wsub"){readForm();bump(S.plan[DAYS[S.cur]]||{},n,-1);render()}
 else if(a==="login"){need(function(){go("profile")})}
 else if(a==="dologin"){
  var nm=$("ln").value.trim(),ph=en($("lp").value).replace(/[\s-]/g,"");
  if(!nm||!/^(\+?88)?01[3-9]\d{8}$/.test(ph)){toast("নাম ও সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)।");return}
  S.user={name:nm,phone:ph};sv("sg_user",S.user);var f=S.after;S.after=null;if(f)f();else go("profile")}
 else if(a==="logout"){S.user=null;try{localStorage.removeItem("sg_user")}catch(x){}render()}
 else if(a==="send"){
  readForm();if(!S.addr.trim()){toast("ডেলিভারি ঠিকানা লিখুন।");return}
  var items=VEG.filter(function(v){return S.cart[v[0]]>0}).map(function(v){return{name:v[0],qty:S.cart[v[0]],unit:v[1],price:v[2],lineTotal:v[2]*S.cart[v[0]]}});
  submit({id:"SG-"+Date.now(),type:"দৈনিক অর্ডার",customer:S.user.name,phone:S.user.phone,address:S.addr.trim(),payment:S.pay,subtotal:sub(),fee:FEE,total:sub()+FEE,status:"নতুন অর্ডার",items:items},function(){S.cart={}})}
 else if(a==="sendw"){
  readForm();if(!S.addr.trim()){toast("সম্পূর্ণ ডেলিভারি ঠিকানা লিখুন।");return}
  if(!S.days.length||S.days.some(function(d){return dsub(d)===0})){toast("প্রতিটি নির্বাচিত দিনে অন্তত একটি সবজি যোগ করুন।");return}
  var dl=DAYS.filter(function(d){return S.days.indexOf(d)>-1}),pl={};dl.forEach(function(d){pl[d]=S.plan[d]});
  submit({id:"SG-"+Date.now(),type:"কাস্টম সাপ্তাহিক প্যাকেজ",customer:S.user.name,phone:S.user.phone,address:S.addr.trim(),payment:S.pay,subtotal:wveg(),fee:dl.length*FEE,total:wveg()+dl.length*FEE,status:"প্যাকেজের অনুরোধ",days:dl,plan:pl,items:[]},function(){S.days=[];S.plan={};S.cur=0})}
 else if(a==="install"&&S.install){S.install.prompt();S.install=null;render()}
});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();S.install=e;if(S.view==="profile")render()});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
render();
</script>
</body>
</html>
